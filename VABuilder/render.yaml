services:
  - type: web
    name: va-builder
    runtime: node
    plan: free
    rootDir: VABuilder
    buildCommand: npm ci --prefix server && npm ci --prefix client --include=dev && npm test --prefix server && npm run lint --prefix client && npm run build --prefix client
    startCommand: npm start --prefix server
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.22.0
